server:
  port: 8080

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: saga-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://74.225.231.92:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  auth:
    admin-emails: ${ADMIN_EMAILS:admin@gmail.com}
    lecturer-emails: ${LECTURER_EMAILS:lecturer@gmail.com}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your_google_client_id.apps.googleusercontent.com}
  jwt:
    secret: ${JWT_SECRET:your_very_long_secret_key_for_jwt_signing_which_should_be_at_least_256_bits}
    expiration-ms: 86400000
  github:
    client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
    client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
  jira:
    client-id: ${JIRA_CLIENT_ID:your_jira_client_id}
    client-secret: ${JIRA_CLIENT_SECRET:your_jira_client_secret}
    redirect-uri: ${JIRA_REDIRECT_URI:http://localhost:3000/identities/callback

springdoc:
  swagger-ui:
    tags-sorter: alpha
    filter: true


